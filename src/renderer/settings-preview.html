<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SHARD — Settings (preview, temporary)</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // TEMPORARY stub of the panel preload, so the settings page runs in a plain browser.
      // Query flags: ?fail=load (settings never load), ?status=muted|snoozed|quiet|fullscreen|many
      (() => {
        const query = new URLSearchParams(location.search);
        const defaults = {
          version: 6,
          startWithSystem: true,
          presets: [{ id: 'codex', name: 'Ordis', skinId: 'eye' }],
          activePresetId: 'codex',
          frequencyProfile: 'balanced',
          quietHours: { enabled: true, from: '23:00', to: '08:00' },
          suppressOnFullscreen: true,
          suppressOnMicrophoneUse: true,
          watchedApps: [
            ['Code.exe', 'app'], ['devenv.exe', 'app'], ['idea64.exe', 'app'], ['pycharm64.exe', 'app'], ['WebStorm64.exe', 'app'],
            ['rider64.exe', 'app'], ['chrome.exe', 'app'], ['firefox.exe', 'app'], ['msedge.exe', 'app'], ['Discord.exe', 'notable'],
            ['Steam.exe', 'launcher'], ['EpicGamesLauncher.exe', 'launcher'], ['Battle.net.exe', 'launcher'], ['obs64.exe', 'notable'],
            ['blender.exe', 'notable'], ['photoshop.exe', 'notable'], ['RiotClientServices.exe', 'launcher'], ['GalaxyClient.exe', 'launcher'],
            ['EADesktop.exe', 'launcher'], ['Spotify.exe', 'notable'], ['Docker Desktop.exe', 'notable'], ['ms-teams.exe', 'notable'],
            ['Zoom.exe', 'notable'], ['dota2.exe', 'game'], ['cs2.exe', 'game'], ['VALORANT-Win64-Shipping.exe', 'game'],
            ['LeagueClientUx.exe', 'game'], ['GTA5.exe', 'game'], ['Mindustry.exe', 'game'], ['FactoryGameSteam.exe', 'game'],
            ['CivilizationVI.exe', 'game'], ['Risk of Rain 2.exe', 'game'], ['Terraria.exe', 'game']
          ].map(([name, kind]) => ({ name, kind })),
          watchedFolders: ['C:\\Users\\maxim\\Downloads'],
          topics: { greetings: true, system: true, apps: true, downloads: true, timeOfDay: true, breaks: true, chatter: true, activeWindow: true },
          focusRemarks: { settling: true, drift: true, long: true, restless: true, tools: true },
          overlay: { placement: 'right', cueVolume: 1, appearSoundEnabled: true, disappearSoundEnabled: true, pinned: false, pinnedPosition: null }
        };
        let settings = {
          ...defaults,
          presets: [...defaults.presets, { id: 'p2', name: 'Shard', skinId: 'eye' }],
          overlay: { ...defaults.overlay, cueVolume: 0.8, pinned: true, pinnedPosition: { x: 1327, y: 212 } }
        };
        const assets = {
          codex: { hasBank: false, hasAppear: false, hasDisappear: false, hasVideo: false },
          p2: { hasBank: true, hasAppear: false, hasDisappear: true, hasVideo: false }
        };
        const noAssets = { hasBank: false, hasAppear: false, hasDisappear: false, hasVideo: false };

        const base = { reasons: [], muted: false, snoozedUntil: null, snoozedUntilRestart: false, quietUntil: null };
        const inAnHour = Date.now() + 60 * 60 * 1000;
        const STATUSES = {
          active: base,
          muted: { ...base, reasons: ['muted'], muted: true },
          snoozed: { ...base, reasons: ['snoozed'], snoozedUntil: inAnHour },
          quiet: { ...base, reasons: ['quietHours'], quietUntil: '08:00' },
          fullscreen: { ...base, reasons: ['fullscreen'] },
          many: { ...base, reasons: ['muted', 'quietHours', 'microphone'], muted: true, quietUntil: '08:00' }
        };
        let status = STATUSES[query.get('status')] ?? base;

        const settingsListeners = new Set();
        const statusListeners = new Set();
        const emit = () => settingsListeners.forEach((l) => l(settings));
        const emitStatus = () => statusListeners.forEach((l) => l(status));
        const later = (value, ms = 30) => new Promise((resolve) => setTimeout(() => resolve(value), ms));
        const clock = /^([01]\d|2[0-3]):[0-5]\d$/;

        window.__calls = [];
        window.__settings = () => settings;
        window.__setStatus = (name) => { status = STATUSES[name] ?? base; emitStatus(); };
        window.__push = (patch) => { settings = { ...settings, ...patch }; emit(); };

        window.codexPanel = {
          getSettings: () => (query.get('fail') === 'load' ? later(null, 200).then(() => { throw new Error('Could not read settings.json'); }) : later(settings)),
          setSettings: (patch) => {
            window.__calls.push(['set', patch]);
            const next = { ...settings, ...patch };
            // The same refusals the real store makes, so error states can be seen.
            if (!clock.test(next.quietHours.from) || !clock.test(next.quietHours.to)) {
              return later({ ok: false, settings, error: 'Must be a time like 23:00.' });
            }
            if (next.presets.some((p) => p.name.trim() === '')) {
              return later({ ok: false, settings, error: 'A name cannot be empty.' });
            }
            if (next.watchedApps.some((a) => a.name.trim() === '')) {
              return later({ ok: false, settings, error: 'An app needs a name.' });
            }
            settings = next;
            emit();
            return later({ ok: true, settings });
          },
          onSettingsUpdated: (handler) => { settingsListeners.add(handler); return () => settingsListeners.delete(handler); },
          getDefaultSettings: () => later(defaults),
          resetSettings: () => {
            settings = { ...defaults, presets: settings.presets, activePresetId: settings.activePresetId };
            emit();
            return later({ ok: true, settings });
          },
          getStatus: () => later(status),
          onStatusUpdated: (handler) => { statusListeners.add(handler); return () => statusListeners.delete(handler); },
          setMuted: (muted) => {
            window.__calls.push(['mute', muted]);
            const reasons = status.reasons.filter((r) => r !== 'muted');
            status = { ...status, muted, reasons: muted ? ['muted', ...reasons] : reasons };
            emitStatus();
          },
          setSnooze: (choice) => {
            window.__calls.push(['snooze', choice]);
            const reasons = status.reasons.filter((r) => r !== 'snoozed');
            const on = choice !== 'off';
            const at = status.muted ? 1 : 0;
            status = {
              ...status,
              reasons: on ? [...reasons.slice(0, at), 'snoozed', ...reasons.slice(at)] : reasons,
              snoozedUntil: choice === '30m' ? Date.now() + 30 * 60000 : choice === '2h' ? Date.now() + 120 * 60000 : null,
              snoozedUntilRestart: choice === 'restart'
            };
            emitStatus();
          },
          sayNow: () => { window.__calls.push(['say']); return later(!status.muted, 150); },
          pickFolder: () => { window.__calls.push(['pickFolder']); return later('D:\\Torrents\\Finished', 150); },
          getDebugSnapshot: () => later({ events: [], cooldowns: [], suppression: { suppressed: false, reason: null, hardMute: false }, deferred: [], knownEventTypes: [], frequencyProfile: 'balanced' }),
          onDebugSnapshot: () => () => {},
          fireEvent: () => {},
          pickPresetAsset: (id, kind) => {
            window.__calls.push(['pick', id, kind]);
            if (kind === 'video') return later({ ok: false, error: 'Video is larger than 20 MB' }, 400);
            const key = { bank: 'hasBank', appearSound: 'hasAppear', disappearSound: 'hasDisappear' }[kind];
            assets[id] = { ...(assets[id] ?? noAssets), [key]: true };
            return later({ ok: true }, 400);
          },
          clearPresetAsset: (id, kind) => {
            window.__calls.push(['clear', id, kind]);
            const key = { bank: 'hasBank', appearSound: 'hasAppear', disappearSound: 'hasDisappear', video: 'hasVideo' }[kind];
            assets[id] = { ...(assets[id] ?? noAssets), [key]: false };
            return later({ ok: true }, 150);
          },
          getPresetAssetStatus: (id) => later(assets[id] ?? noAssets),
          deletePreset: (id) => {
            window.__calls.push(['delete', id]);
            settings = { ...settings, presets: settings.presets.filter((p) => p.id !== id), activePresetId: settings.activePresetId === id ? 'codex' : settings.activePresetId };
            emit();
            return later({ ok: true }, 150);
          },
          duplicatePreset: (id) => {
            const source = settings.presets.find((p) => p.id === id);
            const presetId = 'copy-' + Math.random().toString(36).slice(2, 8);
            assets[presetId] = { ...(assets[id] ?? noAssets) };
            settings = { ...settings, presets: [...settings.presets, { ...source, id: presetId, name: (source.name + ' copy').slice(0, 40) }] };
            emit();
            return later({ ok: true, presetId }, 150);
          },
          openPresetFolder: (id) => { window.__calls.push(['openFolder', id]); return later({ ok: true }); },
          saveBankTemplate: () => { window.__calls.push(['template']); return later({ ok: true }, 150); }
        };
      })();
    </script>
    <script type="module" src="./settings.tsx"></script>
  </body>
</html>
